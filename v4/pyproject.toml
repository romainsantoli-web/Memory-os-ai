[project]
name = "memory-os-v4"
version = "4.0.0"
description = "Memory OS v4: a local-first long-term memory engine for LLM agents."
requires-python = ">=3.11"

[tool.pytest.ini_options]
markers = [
    "slow: uses the real sentence-transformers model (still runs by default)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.setuptools.packages.find]
where = ["src"]
